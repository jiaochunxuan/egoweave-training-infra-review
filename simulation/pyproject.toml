[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "egoweave-ch4-simulation"
version = "0.1.0"
description = "Public M4 pretraining and downstream simulation adapters for EgoWeave Chapter 4"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
simulation = [
  "av>=12.0",
  "pyarrow>=15.0",
  "pillow>=10.0",
  "torch>=2.2",
]
pretrain = [
  "h5py>=3.10",
  "pillow>=10.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
